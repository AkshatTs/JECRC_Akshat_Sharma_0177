<div class="dashboard-card">
  <div class="card-header">
    <h2>Dashboard Component</h2>
    <span class="strategy-badge onpush">Strategy: OnPush</span>
  </div>
  
  <div class="score-display">
    Dashboard View Score: <span>{{ userStats.score }}</span>
  </div>

  <div class="action-grid">
    <div class="action-panel broken-panel">
      <h3>Test 1: Mutate Object</h3>
      <button class="btn btn-danger" (click)="updateLocally()">Run updateLocally()</button>
      <p>Notice: Dashboard score stays stuck, but Stats score updates.</p>
    </div>

    <div class="action-panel fixed-panel">
      <h3>Test 2: New Reference</h3>
      <button class="btn btn-success" (click)="updateFixed()">Run updateFixed()</button>
      <p>Notice: Uses spread operator. Both views update instantly.</p>
    </div>
  </div>

  <div class="child-container">
    <app-stats [userStats]="userStats"></app-stats>
  </div>
</div>
